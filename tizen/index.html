<!DOCTYPE html>
<!--
  MSIGN for Samsung Tizen TVs — launcher page (docs/CONTRACTS.md §22). Shows a black screen with
  the wordmark for a moment, then hands the whole app over to the MSIGN player on the site, so
  the TV runs the very same player as every other device (first-party storage, instant updates).
  If the TV has no network yet it keeps retrying instead of showing a browser error page.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, user-scalable=no">
  <title>MSIGN</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; }
    .wrap { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; }
    .mark { display: inline-block; padding: 14px 28px; border-radius: 14px; background: #5b57e8;
      font-size: 42px; font-weight: 800; letter-spacing: 3px; }
    .note { margin-top: 28px; font-size: 24px; color: rgba(255,255,255,.6); max-width: 70%; line-height: 1.5; }
    .fine { margin-top: 14px; font-size: 16px; color: rgba(255,255,255,.3); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">MSIGN</div>
    <div class="note" id="note">Starting…</div>
    <div class="fine" id="fine"></div>
  </div>
  <script>
    (function () {
      var PLAYER = 'https://msign-iota.vercel.app/player';
      var note = document.getElementById('note');
      var fine = document.getElementById('fine');
      var delay = 3000;
      fine.textContent = navigator.userAgent;

      // Wait until the site answers, then navigate — a plain redirect on a TV that booted before
      // Wi-Fi is up lands on a dead browser error page with no way back.
      function attempt() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', PLAYER + '?probe=' + Date.now(), true);
        xhr.timeout = 8000;
        xhr.onload = function () {
          if (xhr.status >= 200 && xhr.status < 500) { location.replace(PLAYER); return; }
          later('MSIGN is temporarily unavailable (' + xhr.status + ').');
        };
        xhr.onerror = xhr.ontimeout = function () {
          later("Can't reach MSIGN yet — check the TV's network. Retrying…");
        };
        try { xhr.send(); } catch (e) { later('Network error. Retrying…'); }
      }
      function later(msg) {
        note.textContent = msg;
        setTimeout(attempt, delay);
        delay = Math.min(delay * 2, 30000);
      }
      attempt();
    })();
  </script>
</body>
</html>
