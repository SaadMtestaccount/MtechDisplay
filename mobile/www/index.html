<!DOCTYPE html>
<!--
  mobile/www/index.html — bundled placeholder. The app normally shows the hosted console
  (capacitor.config.ts → server.url); this page is only ever seen if the shell falls back to local
  content, e.g. with no network at first launch. It keeps retrying.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MSIGN</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f5f6fa; color: #111827;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 24px; }
    .mark { display: inline-block; padding: 12px 22px; border-radius: 12px; background: #5b57e8;
      color: #fff; font-size: 26px; font-weight: 800; letter-spacing: 3px; }
    .note { margin-top: 22px; font-size: 18px; color: #6b7280; line-height: 1.5; max-width: 320px; }
    button { margin-top: 22px; height: 52px; padding: 0 26px; border: 0; border-radius: 14px;
      background: #5b57e8; color: #fff; font-size: 18px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">MSIGN</div>
    <div class="note" id="note">You're not connected. Check Wi-Fi or mobile data and try again.</div>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
